<script>
const qs=[{"ch": 6, "num": 9, "q": "針對一位處於「意向階段」（Contemplation）的吸菸者，衛教人員若想最有效率地協 助他推進至下一個階段，應優先採取哪一種干預策略？", "options": ["提供持續六個月的獎勵機制以鞏固已達成的戒菸成果", "討論他對戒菸所知覺到的利益與障礙，協助其尋求克服障礙的方法", "僅重複警告吸菸可能導致致命肺癌的嚴峻恐懼訊息", "要求他立即設定精確的戒菸日並簽署戒菸契約"], "answer": 1}, {"ch": 2, "num": 21, "q": "在細胞介導免疫（Cell-mediated immunity）中，哪一種 T 細胞負責「踩煞車」，以防 止感染消除後免疫反應過度傷害自體？", "options": ["抑制性 T 細胞（Suppressor T cells）", "殺手 T 細胞（Killer T cells）", "記憶 T 細胞（Memory T cells）", "輔助 T 細胞（Helper T cells）"], "answer": 0}, {"ch": 5, "num": 11, "q": "醫師在開立抗焦慮藥物協助患者管理壓力時，乙型阻斷劑（beta-blockers）相較於 苯二氮平類（benzodiazepines）藥物的主要生理作用差異為何？", "options": ["乙型阻斷劑適合做為長期控制壓力的唯一手段，無須配合心理技巧學習。", "乙型阻斷劑作用於周邊神經系統，阻斷腎上腺素活性，因此較不易引發嗜睡。", "苯二氮平類藥物的副作用遠低於乙型阻斷劑，且不會產生藥物依賴。", "乙型阻斷劑透過活化中央神經系統的 GABA 遞質來降低大腦神經傳導。"], "answer": 1}, {"ch": 2, "num": 6, "q": "小腦（Cerebellum）在人類進行精細運動（如彈鋼琴或寫字）時發揮關鍵作用，下列哪 一項不是它的主要功能？", "options": ["啟動肌肉運動的初始指令", "平滑運動並抑制震顫", "比較運動意圖與實際表現", "維持身體平衡與姿勢"], "answer": 0}, {"ch": 2, "num": 2, "q": "多發性硬化症（Multiple sclerosis）患者會出現肌肉無力、動作不協調且痙攣，這是因 為神經系統中的哪一種病變所導致？", "options": ["髓鞘退化並導致神經受損", "樹突與突觸之間的連結中斷", "神經傳導物質分泌不足", "神經元細胞體數量大幅減少"], "answer": 0}, {"ch": 3, "num": 2, "q": "小明在面臨一場重要的期末考時，他心裡想著：「如果我考不好，我可能就無法畢業 了。」這屬於哪一種認知評估過程？", "options": ["初步評估（Primary appraisal）中的「無關」評估", "初步評估（Primary appraisal）中的「挑戰」評估", "初步評估（Primary appraisal）中的「威脅」評估", "次級評估（Secondary appraisal）"], "answer": 2}, {"ch": 3, "num": 19, "q": "下列哪種情況最能體現「穩態負荷（Allostatic load）」中提到的「修復不足（ Resource restoration）」？", "options": ["長期睡眠不足導致身體無法補充壓力消耗的能量。", "面對小事時產生過大的生理反應。", "在壓力事件後，心率迅速回到基準值。", "頻繁地遇到強烈的壓力源。"], "answer": 0}, {"ch": 2, "num": 5, "q": "當身體缺水或缺乏營養時，大腦中哪一個構造會檢測到這種失衡，並引發渴覺或飢餓 感以維持恆定性（Homeostasis）？", "options": ["視丘（Thalamus）", "小腦（Cerebellum）", "下視丘（Hypothalamus）", "邊緣系統（Limbic system）"], "answer": 2}, {"ch": 2, "num": 8, "q": "當你正在過馬路時，突然有一輛超速的汽車向你衝來，此時你的自律神經系統會產生 哪種反應？", "options": ["副交感神經系統激活，增加唾液分泌並加速胃部收縮", "自律神經系統暫時關閉，將所有控制權交給大腦皮質", "軀體神經系統接管，自動停止所有內臟器官活動", "交感神經系統激活，導致瞳孔放大並加速心跳"], "answer": 3}, {"ch": 4, "num": 3, "q": "關於「緩衝假說」（Buffering Hypothesis）的運作機制，下列敘述何者正確？", "options": ["社會支持透過增加心血管反應來抵銷壓力", "無論壓力大小，社會支持對健康的益處皆相同", "緩衝作用僅發生在壓力源出現之前的預防階段", "社會支持主要在高壓力情境下發揮保護作用"], "answer": 3}, {"ch": 2, "num": 4, "q": "大腦中的額葉（Frontal lobe）若受到損傷，除了影響運動功能外，最明顯的變化通常 體現在哪一方面？", "options": ["性格與情緒調節的改變", "無法辨識視覺對象的意義", "聽覺與平衡感的喪失", "皮膚觸覺與痛覺的消失"], "answer": 0}, {"ch": 2, "num": 7, "q": "腦幹中的延髓（Medulla）若受損，通常會危及生命，這是因為延髓主要負責控制下列 哪一項功能？", "options": ["面部表情與咀嚼動作", "複雜的感知與學習活動", "心跳率與呼吸深度", "睡眠、覺醒與注意力"], "answer": 2}, {"ch": 4, "num": 2, "q": "根據圖 4-1 的研究數據，癌症患者與患有非致命性慢性疾病的患者相比，對哪一種社 會支持的需求有顯著差異？", "options": ["癌症患者認為有形支持比資訊支持更重要", "癌症患者認為情緒或自尊支持最為有效", "非致命性慢性病患者完全不需要情緒支持", "資訊性支持是所有患者一致認為最無效的支持"], "answer": 1}, {"ch": 3, "num": 25, "q": "「良性壓力（Eustress）」與「痛苦（Distress）」的主要區別通常在於：", "options": ["兩者在認知評估過程中完全沒有任何差異。", "良性壓力通常伴隨著積極的情緒與成功的控制感。", "痛苦只會在身體生病時發生。", "良性壓力完全不會引起生理喚起。"], "answer": 1}, {"ch": 5, "num": 4, "q": "研究發現，在一般調查中男性比女性報告使用更多的問題焦點因應，但當比較職業與 教育背景相同的男女時，這種差異便消失了。這項結果主要說明了什麼？", "options": ["問題焦點因應完全由遺傳因素決定，與後天環境無關。", "因應策略的性別差異很大程度上受到社會角色與教育/社經經驗的影響。", "社經地位較高的人傾向使用更多的情緒焦點因應。", "女性在生理上缺乏進行問題解決訓練的能力。"], "answer": 1}, {"ch": 2, "num": 10, "q": "在消化過程中，大部分營養物質的吸收主要發生在消化道的哪一個部位？", "options": ["大腸", "食道", "胃", "小腸"], "answer": 3}, {"ch": 2, "num": 17, "q": "下列哪一種生理狀態或因素通常會導致血液黏稠度（Viscosity）增加，進而需要更高 的血壓才能推動循環？", "options": ["血管壁的彈性增加", "血液中紅血球濃度過高", "大量飲水導致血漿比例提升", "心輸出量大幅減少"], "answer": 1}, {"ch": 3, "num": 23, "q": "根據認知評估理論，如果一個人在工作負擔沉重時，尋求朋友「金妮」的幫助，這屬 於：", "options": ["一般適應綜合症", "初步評估（Primary appraisal）", "生理反應（Reactivity）", "次級評估（Secondary appraisal）"], "answer": 3}, {"ch": 4, "num": 10, "q": "根據 Langer 與 Rodin 在療養院進行的研究，賦予長者「對生活的責任感」產生了 什麼長期影響？", "options": ["死亡率顯著降低且健康狀況改善", "僅對原本就非常健康的長者有效", "長者因壓力增加而變得更加焦慮", "短期內有益但一年後效果消失"], "answer": 0}, {"ch": 5, "num": 13, "q": "系統減敏法（systematic desensitization）是基於古典條件化原理來減輕恐懼。根 據 Joseph Wolpe 的觀點，其成功的關鍵機制「逆條件化」（counterconditioning）是 指什麼？", "options": ["透過認知重塑直接否定個體過去的創傷記憶。", "透過將原本引發恐懼的制約刺激與引發平靜的事件配對，使平靜反應取代原有的 恐懼反應。", "透過操作制約（operant conditioning）中的強化作用，獎勵個體逃避恐懼情境。", "透過讓個體持續暴露於最強烈的恐懼刺激中，直到生理疲竭。"], "answer": 1}, {"ch": 3, "num": 17, "q": "根據日常煩惱量表（Hassles Scale）的研究，日常煩惱與健康的相關性通常表現為：", "options": ["僅與心理健康相關，與生理症狀無關。", "比重大生活事件（Life events）更能預測健康狀況。", "完全沒有相關性。", "只有在個體同時經歷積極事件（Uplifts）時才有相關。"], "answer": 1}, {"ch": 5, "num": 8, "q": "根據 Alan Lakein 提出的時間管理（time management）方法，下列何者是建立每日 待辦事項清單（to-do list）時的關鍵原則？", "options": ["應將清單默記於腦海中，以便隨時進行彈性調整。", "待辦清單應僅關注當天可完成的小事，無須考慮長期目標。", "一旦排定當天行程，即使出現緊急的新任務也不得調整清單。", "必須以書面形式列出，並結合長期與短期目標標明優先順序。"], "answer": 3}, {"ch": 5, "num": 12, "q": "執行「漸進式肌肉鬆弛法」（progressive muscle relaxation）時，關於肌肉緊繃與 放鬆步驟的標準操作，下列何者正確？", "options": ["練習時應盡可能同時使全身所有肌肉群一口氣緊繃，以節省時間。", "肌肉應持續繃緊至少 30 秒以上，放鬆時間則越短越好。", "當練習者完全熟練該技術後，每次練習仍必須保留長時間的繃緊動作。", "每個肌肉群先繃緊 7 至 10 秒，隨後放鬆約 15 秒，並感受其間的感覺差異。"], "answer": 3}, {"ch": 2, "num": 15, "q": "在呼吸系統的保護機制中，所謂的「黏膜纖毛扶梯」（Mucociliary escalator）是如何 運作的？", "options": ["纖毛將黏有異物的黏液向上推向口腔，隨後被吞嚥或吐出", "利用黏液中的強酸直接在氣管內消滅所有吸入的細菌", "藉由打噴嚏產生的氣流將黏液直接吸入肺泡進行分解", "纖毛像牙齒一樣磨碎大顆粒灰塵，使其能被排出"], "answer": 0}, {"ch": 6, "num": 19, "q": "關於性別與健康的統計與觀察結果，下列哪一項敘述符合來源文本中的內容？", "options": ["女性的平均預期壽命較長，但通常比男性報告更多的急性疾病與非致命性慢性病", "雌激素會增加血液中的膽固醇並促進血小板凝集，從而增加女性心臟病風險", "男性比女性更傾向於在感到身體不適時主動尋求醫師的診斷與協助", "男性的生理應激反應（如血壓與壓力荷爾蒙）低於女性，因此心血管風險較低"], "answer": 0}, {"ch": 6, "num": 21, "q": "在預防愛滋病毒（HIV）感染的衛教中，下列哪一項關於 HIV 傳播的說法是符合科學 事實的？", "options": ["醫療人員在照顧愛滋病患者時，即使不小心被針頭扎到，感染 HIV 的風險極高", "一般日常生活接觸（如擁抱、握手或共用辦公設備）以及蚊蟲叮咬皆不會傳播 HIV", "男性接受切除包皮手術（Circumcision）會顯著增加透過性行為感染 HIV 的風險", "血液檢測通常能在感染 HIV 後的一週內準確診斷出是否感染"], "answer": 1}, {"ch": 6, "num": 12, "q": "在非預期的社交情境中（例如派對上的過量飲酒），影響個人產生高「意願度」（ Willingness）以從事風險行為的關鍵因素，不包括下列何者？", "options": ["個體對執行該風險行為者擁有正面且良好的社交形象印象", "對該風險行為所導致長期健康後果進行過詳細的理性風險評估", "個體感受到的主觀規範對該行為持正面或許可態度", "個體過去曾有從事該風險行為的經驗"], "answer": 1}, {"ch": 3, "num": 21, "q": "當一個人即使在壓力源消失後仍不斷「反芻（Rumination）」過去的困難，這會對生 理產生什麼影響？", "options": ["加快生理反應恢復到基準水平的速度。", "透過大腦練習增強對未來壓力的抵抗力。", "立即觸發一般適應綜合症的「耗竭階段」。", "延遲生理恢復，增加長期的生理磨損。"], "answer": 3}, {"ch": 2, "num": 25, "q": "所謂的「自體免疫疾病」（Autoimmune diseases），其發病的根本原因為何？", "options": ["身體完全失去了產生淋巴細胞的能力", "病毒佔據了細胞並將其轉化為病毒工廠", "長期營養不良導致抗體無法形成", "免疫系統錯誤地攻擊身體健康的組織和骨骼"], "answer": 3}, {"ch": 6, "num": 16, "q": "在動機式訪談（Motivational Interviewing）中，諮商師邀請個案列出改變行為（如 戒酒）與不改變行為的「優點與缺點」並進行討論。這項技術被稱為：", "options": ["自我管理 (Self-management)", "決策平衡 (Decisional balance)", "個別化回饋 (Personalized feedback)", "戒斷預防 (Relapse prevention)"], "answer": 1}, {"ch": 2, "num": 23, "q": "根據 Kiecolt-Glaser 等人的研究，壓力與免疫功能的關係如何？", "options": ["壓力會使免疫系統過度反應，導致基礎代謝率永久性提升", "只有身體上的疲勞會影響免疫力，心理壓力並無影響", "處於高壓力（如期末考或離婚）期間的人，其殺手 T 細胞活性顯著下降", "適度的短期壓力能顯著增加抗體的產生，提高整體免疫力"], "answer": 2}, {"ch": 5, "num": 10, "q": "在準備面對手術等強烈壓力事件時，若護理人員教導病人如何透過專注於手術的正 面或益處（而非令人不快之處）來調整思維，這屬於哪一種心理控制的提升？", "options": ["認知控制（Cognitive control）", "行為控制（Behavioral control）", "避險控制（Aversive control）", "資訊控制（Informational control）"], "answer": 0}, {"ch": 6, "num": 22, "q": "根據 70 歲男性風險因素與活到 90 歲機率的統計數據，下列哪一種單一風險因素 對活到 90 歲機率的負面影響最大（即存活率最低）？", "options": ["患有糖尿病 (Having diabetes)", "肥胖 (Being obese)", "吸菸 (Smoking)", "靜態生活方式 (Having a sedentary lifestyle)"], "answer": 2}, {"ch": 2, "num": 20, "q": "關於免疫系統中的抗原（Antigen），下列敘述何者最符合其定義？", "options": ["任何能引發身體免疫反應的「非自我」物質", "專門負責吞噬入侵細菌的白血球細胞", "僅限於具有生命的微生物，如細菌或寄生蟲", "一種由 B 細胞產生，專門用來標記病原體的蛋白質"], "answer": 0}, {"ch": 5, "num": 20, "q": "關於催眠（hypnosis）在壓力管理中的應用與個體的「可催眠性/暗示性」（ suggestibility），下列敘述何者正確？", "options": ["自我催眠（self-hypnosis）是不可能的，個體必須完全依賴催眠師的現場引導。", "催眠能產生神奇的減壓效果，其功效遠超越任何行為或認知放鬆療法。", "暗示性在 7 至 14 歲的兒童中最強，隨後在青春期下降並於成年期保持穩定；催 眠的減壓效果不一定優於其他放鬆技術。", "大約 80% 以上的成年人都能輕易且深度地進入催眠狀態。"], "answer": 2}, {"ch": 5, "num": 18, "q": "針對低收入高風險孕婦的壓力管理計畫，研究發現結合壓力管理、團體社會支持、 問題解決訓練與健康教育的多維度介入，產生了什麼重要的健康效益？", "options": ["完全消除了孕婦在懷孕期間的所有生理不適反應。", "僅能提升孕婦的短期情緒，對嬰兒的健康指標無任何影響。", "增加了孕婦對醫療體系的不信任感與焦慮。", "顯著降低了早產（pre-term birth）與嬰兒低出生體重的風險。"], "answer": 3}, {"ch": 5, "num": 1, "q": "關於心理學中「因應」（coping）的概念，下列哪一項敘述最適當地反映了其核心特 徵？", "options": ["因應是個體內在固定的性格特質，不會隨個體與環境的持續互動而發生改變。", "因應僅發生在個體客觀上完全缺乏任何應對資源的極端高壓情境中。", "因應特指那些能夠成功消除壓力源並恢復生理平衡的客觀結果。", "因應是一個動態的交易歷程，旨在管理個體所評估到的需求與資源差距，其努力 不一定能完全解決問題。"], "answer": 3}, {"ch": 2, "num": 22, "q": "愛滋病（AIDS）之所以致命，是因為 HIV 病毒主要破壞了哪一種在免疫系統中起協 調中心作用的細胞？", "options": ["輔助 T 細胞（Helper T cells / CD4）", "B 細胞", "巨噬細胞", "紅血球細胞"], "answer": 0}, {"ch": 6, "num": 10, "q": "當一名重度飲酒者閱讀到研究報告指出「每日過量飲酒會顯著增加肝硬化風險」時， 他刻意批評該研究樣本數不足且方法有瑕疵，藉此合理化自己繼續飲酒的行為。這種心 理現象屬於下列何者？", "options": ["動機性推理 (Motivated reasoning)", "不切實際的樂觀 (Unrealistic optimism)", "戒斷違反效應 (Abstinence-violation effect)", "過度警覺 (Hypervigilance)"], "answer": 0}, {"ch": 5, "num": 17, "q": "在認知治療（Cognitive Therapy）中，治療師常引導個體使用「假設檢定」（ hypothesis testing）技術。這種技術的主要操作過程為何？", "options": ["要求個體每天重複背誦正向肯定句，直到自動覆蓋負面思維。", "要求個體完全迴避所有可能引發負面想法的情境。", "透過催眠暗示直接改變大腦中的神經迴路。", "將失調的信念視為一個有待驗證的假設，並在日常生活中蒐集支持與反對該信念 的客觀證據。"], "answer": 3}, {"ch": 6, "num": 17, "q": "一名成功戒菸三個月的男子，在一次聚會中抽了一根菸。隨後他感到強烈的罪惡感 與自責，認為自己「意志力薄弱、徹底失敗了」，於是完全放棄努力並恢復每天抽一包 菸。這種認知與行為過程屬於：", "options": ["不切實際的樂觀 (Unrealistic optimism)", "動機性推理 (Motivated reasoning)", "戒斷違反效應 (Abstinence-violation effect)", "操作制約消退 (Extinction)"], "answer": 2}, {"ch": 3, "num": 18, "q": "關於壓力與功能品質的關係（如圖 3-3 所示），當一個學生面對一場「佔總分 0.1%」 的小測驗時，他最可能處於哪種狀態？", "options": ["喚起水平過高，導致表現崩潰。", "喚起水平不足，可能導致表現草率或不佳。", "壓力導致身體資源迅速耗竭。", "處於最佳喚起水平，表現最出色。"], "answer": 1}, {"ch": 5, "num": 21, "q": "在 Roskies 等人 (1986) 的實驗中，研究人員比較了多維度壓力管理計畫、有氧運 動與重量訓練對 A 型行為男性的影響。研究結果顯示多維度計畫產生了什麼獨特效 果？", "options": ["效果與單純進行重量訓練組完全相同，顯示心理介入並無額外價值。", "顯著提升了受試者在面對壓力時的心率與血壓反應。", "其減壓效果在計畫結束後數天內即完全消退，無法長期維持。", "顯著降低了 A 型行為中的「敵意」（hostility）成分，而運動組則無此顯著下降。"], "answer": 3}, {"ch": 6, "num": 1, "q": "一名 40 歲的無症狀男子定期前往診所進行大腸鏡檢查。這種醫療檢查屬於哪一級 別的預防措施？", "options": ["三級預防 (Tertiary prevention)", "次級預防 (Secondary prevention)", "症狀導向行為 (Symptom-based behavior)", "初級預防 (Primary prevention)"], "answer": 1}, {"ch": 6, "num": 2, "q": "一位上班族在出現劇烈腹痛後前往醫院就診，取得處方藥後請假在家休息，並請家人 協助處理家務。他在「請假在家休息並請家人代勞家務」時所展現的是何種行為？", "options": ["健康維護行為 (Well behavior)", "症狀導向行為 (Symptom-based behavior)", "初級預防行為 (Primary prevention behavior)", "病患角色行為 (Sick-role behavior)"], "answer": 3}, {"ch": 2, "num": 3, "q": "根據大腦的功能側化研究，當一個人在欣賞一段悠揚的旋律或處理空間幾何視覺影 像時，大腦的哪一部分通常最為活躍？", "options": ["左半球", "中腦", "右半球", "腦幹"], "answer": 2}, {"ch": 6, "num": 15, "q": "若要在健康宣導中使用「恐懼訴求」（Fear appeals）並使其發揮最大的行為改變效 果，訊息內容必須具備下列哪項關鍵要素？", "options": ["避免提及任何社會性後果，僅聚焦於嚴重的生理器官病變", "確保訊息引發最高等級的恐慌，且不提供任何即時的解決途徑", "提供執行預防行為的具體指示或技能訓練，並增強自我效能", "僅使用客觀的大數據統計概率來呈現疾病發生的率值"], "answer": 2}, {"ch": 5, "num": 23, "q": "關於使用壓力管理技術治療本態性高血壓（essential hypertension）的統合分析（ Linden & Chambers, 1994），下列結論何者正確？", "options": ["未受過訓練的高血壓患者只要憑意志力「試著放鬆」，就能輕鬆降低血壓。", "壓力管理僅能降低心率，對收縮壓與舒張壓均無任何改變作用。", "結合行為與認知方法的多維度壓力管理計畫在降低血壓方面，與利尿劑藥物一樣 有效。", "單一放鬆技術（如漸進式肌肉放鬆）的效果遠優於多維度綜合計畫。"], "answer": 2}, {"ch": 2, "num": 1, "q": "在神經元中，負責接收來自鄰近神經元訊息的構造是下列哪一個？", "options": ["樹突（Dendrites）", "突觸小泡（Synaptic knobs）", "軸突（Axon）", "髓鞘（Myelin sheath）"], "answer": 0}, {"ch": 3, "num": 24, "q": "關於工作壓力的敘述，下列何者會顯著「降低」員工的壓力感？", "options": ["取消所有對員工工作表現的評估。", "讓員工參與決策並擁有更多學習新技能的機會。", "將辦公室環境的光線調至極暗，以減少刺激。", "增加工作的重複性，使其變得更單調。"], "answer": 1}, {"ch": 4, "num": 8, "q": "當人體面臨心理壓力時，心率與血壓的上升往往超過了身體實際代謝的需求。這種現 象主要被稱作什麼？", "options": ["恆定負載（Allostatic Load）", "體質壓力模型（Diathesis-Stress Model）", "迷走神經張力（Vagal Tone）", "心血管反應性（Cardiovascular Reactivity）"], "answer": 3}, {"ch": 6, "num": 6, "q": "根據健康信念模型（Health Belief Model），如果一位長期吸菸者認為「雖然肺癌很嚴 重，但我家族中沒有人得過肺癌，所以我罹患肺癌的機率極低」，這代表他在哪一個評估 維度上的認知偏低？", "options": ["知覺到的障礙 (Perceived barriers)", "知覺到的利益 (Perceived benefits)", "知覺到的嚴重性 (Perceived seriousness)", "知覺到的易感性 (Perceived susceptibility)"], "answer": 3}, {"ch": 3, "num": 6, "q": "在一般適應綜合症（GAS）的哪一個階段，身體會為了適應持續的壓力源而使 HPA 軸 的活化成為主導？", "options": ["抗拒階段（Stage of resistance）", "基準階段（Baseline stage）", "耗竭階段（Stage of exhaustion）", "警覺反應（Alarm reaction）"], "answer": 0}, {"ch": 6, "num": 25, "q": "關於電子化健康促進干預（Electronic health promotion interventions，如網 路或電腦程式），研究顯示其主要優點與面臨的最大挑戰分別為何？", "options": ["優點是能強制使用者達成目標，挑戰是無法在青少年群體中推行", "優點是完全不需要個人化回饋，挑戰是開發成本遠高於實體面談", "優點是能完全消除失誤（Lapses），挑戰是無法應用於戒酒或戒菸等重度成癮行為", "優點是能輕鬆覆蓋全球廣大受眾，挑戰是開始使用的人中有近 50% 會中途流失 (Dropout)"], "answer": 3}, {"ch": 6, "num": 23, "q": "一位中年男子在電視上看到一部關於心臟病發作症狀的醫療劇後，想起自己最近偶 爾胸悶，於是決定預約心臟科檢查。在此情境中，電視節目扮演了健康信念模型中的哪 種角色？", "options": ["知覺到的障礙 (Perceived barriers)", "行動線索 (Cues to action)", "知覺到的易感性 (Perceived susceptibility)", "主觀規範 (Subjective norm)"], "answer": 1}, {"ch": 3, "num": 14, "q": "關於社會經濟地位（SES）與壓力的關係，下列敘述何者錯誤？", "options": ["單純「感覺」自己地位較低也會損害健康。", "低 SES 個體的壓力激素（如皮質醇）水平通常較高。", "低 SES 族群報告的重大生活壓力事件數量較多。", "低 SES 鄰里中的居民往往感到更安全且更有控制感。"], "answer": 3}, {"ch": 6, "num": 7, "q": "依據計畫行為理論（Theory of Planned Behavior），若一位民眾想要開始實行低脂 飲食，且他認為「親友都支持我吃得更健康，我也很在乎他們的看法」，這項心理評估屬 於下列哪一個因素？", "options": ["對行為的態度 (Attitude regarding the behavior)", "行動意圖 (Intention)", "主觀規範 (Subjective norm)", "知覺到的行為控制 (Perceived behavioral control)"], "answer": 2}, {"ch": 5, "num": 14, "q": "在運用生物回饋（biofeedback）治療重複性頭痛時，研究發現兒童通常比成人展現 出更好的療效與學習速度。下列何者不是解釋此現象的原因？", "options": ["兒童對自己能否成功與獲益較少抱持懷疑態度。", "兒童通常比成人更願意遵照指示在家中進行練習。", "許多兒童將生物回饋視為有趣的遊戲，具備更高的參與興趣與動機。", "兒童的注意力持續時間顯著長於成人，能進行長時間不間斷的儀器訓練。"], "answer": 3}, {"ch": 4, "num": 6, "q": "五大性格模型（Five-Factor Model）中的哪一項特質，最能預測一個人是否會執行健 康行為（如規律運動、不吸菸）", "options": ["盡責性（Conscientiousness）", "外向性（Extraversion）", "開放性（Openness）", "神經質（Neuroticism）"], "answer": 0}, {"ch": 6, "num": 11, "q": "關於「不切實際的樂觀」（Unrealistic optimism）之研究，下列哪一種情境最可能導 致個體的這種樂觀認知暫時消失，轉而出現「不切實際的悲觀」？", "options": ["個體具有極高的責任心（Conscientiousness）人格特質時", "個體正面臨即時且具體的重大健康威脅（如核事故輻射陰影或在診所等待看診 時）", "個體年齡增長進入老年期，開始感受到生理機能衰退時", "個體獲得豐富的健康衛教資訊，清楚了解所有疾病的生理機制時"], "answer": 1}, {"ch": 5, "num": 6, "q": "在人際問題管理中，「自信/肯定行為」（assertiveness）與「攻擊行為」（ aggressiveness）或「不自信行為」（unassertiveness）的主要區別為何？", "options": ["自信行為能直接表達個人的觀點與偏好，且不涉及對他人的威脅或侮辱。", "自信訓練的目的在於教導個體如何徹底迴避所有人際衝突。", "不自信的人傾向將壓力情境評估為挑戰，從而促進更佳的生理適應。", "自信行為旨在透過威脅與控制手段迫使對方屈服於自己的需求。"], "answer": 0}, {"ch": 2, "num": 9, "q": "內分泌系統與神經系統雖然都負責訊息傳遞，但兩者的運作方式有所不同。下列哪一 項是內分泌系統的特點？", "options": ["僅在脊髓中釋放，不影響遠端器官", "利用電化學訊號在神經元之間傳遞，反應極快", "透過專門的管道直接將分泌物排入目標器官內部", "化學物質隨血液流動，效果通常較遲緩但持久"], "answer": 3}, {"ch": 5, "num": 2, "q": "某位員工在面臨部門可能裁員的危機時，一邊報名職業進修課程以提升專業技能，一 邊向好友傾訴以抒解焦慮。該員工採取的因應策略屬於下列何者？", "options": ["僅使用了問題焦點因應中的尋求資訊與直接行動。", "僅使用了情緒焦點因應中的行為宣洩與尋求支持。", "屬於迴避型因應與防衛機轉的結合。", "同時使用了問題焦點因應與情緒焦點因應。"], "answer": 3}, {"ch": 4, "num": 4, "q": "一名男子在工作上遭遇連續挫折，他認為「我是一個徹底的失敗者，不管換到什麼公 司都一樣」。根據習得性無助理論，他的歸因方式屬於下列哪一組？", "options": ["內部、穩定、全面性", "外部、不穩定、特定性", "外部、穩定、全面性", "內部、不穩定、特定性"], "answer": 0}, {"ch": 3, "num": 13, "q": "為什麼醫療人員的工作通常被認為比一般辦公室工作更具壓力？", "options": ["因為他們對他人的生命負有重大責任。", "因為他們需要長時間坐著，缺乏運動。", "因為他們完全缺乏與他人的社交互動。", "因為 fun他們的工作環境通常噪音極低。"], "answer": 0}, {"ch": 5, "num": 3, "q": "比較中年人與老年人在面對生活壓力時的因應方式，研究顯示老年人傾向使用較多 的情緒焦點因應，這主要是因為什麼？", "options": ["老年人傾向將其面臨的壓力事件（如健康衰退）評估為較不可改變。", "老年人的認知發展出現倒退，無法執行問題焦點因應所需的邏輯思考。", "中年人所面臨的壓力事件（如家庭與財務）客觀上無法被改變。", "老年人的社交網絡顯著大於中年人，因此擁有更多獲得情緒支持的管道。"], "answer": 0}, {"ch": 3, "num": 3, "q": "在關於「割禮（Subincision）」影片的實驗中，哪一組受試者表現出的生理壓力反應 （如心率）最低？", "options": ["聽到強調疼痛與危險的「創傷」敘述組", "這四組受試者的生理反應均沒有顯著差異", "沒有任何音軌的無聲組", "聽到否認痛苦並稱其為「快樂時刻」的敘述組"], "answer": 3}, {"ch": 5, "num": 24, "q": "Gene Brody 等人 (2014) 針對非裔美國人高風險家庭實施了為期 7 週的早期逆境 預防介入。在 9 年後的追蹤研究中，接受介入的青少年在生理指標上有何顯著表現？", "options": ["免疫系統出現嚴重的自體免疫排斥反應。", "尿液中的兒茶酚胺濃度異常暴增，顯示其長期壓力反應被過度激化。", "生理數據與對照組無任何統計上的差異。", "尿液中的兒茶酚胺（catecholamines）濃度顯著低於未接受介入的對照組青少年。"], "answer": 3}, {"ch": 3, "num": 15, "q": "測謊機（Polygraph）主要透過測量哪些生理指標來評估一個人的喚起水平？", "options": ["肌肉力量、骨密度、血液含氧量", "血壓、心率、呼吸頻率、皮膚電反應（GSR）", "腦電波活動、體重、視力變化", "尿液中的皮質醇含量、血糖水平"], "answer": 1}, {"ch": 6, "num": 18, "q": "孕婦在懷孕期間若重度飲酒，胎兒出生後容易患有胎兒酒精綜合症（Fetal alcohol syndrome）。下列哪一項不屬於該綜合症的典型特徵？", "options": ["出生前與出生後的生長遲緩", "特定的面部特徵（如眼裂偏小）", "出生後體重與身高過度快速生長", "智能發育缺陷與認知障礙"], "answer": 2}, {"ch": 2, "num": 13, "q": "根據圖 2-12 的趨勢顯示，下列哪一項關於基礎代謝率（BMR）的判斷最為準確？", "options": ["隨著年齡增長，一個人的基礎代謝率會逐漸升高", "女性在進入成年期後，基礎代謝率會超越男性", "20 歲以後，基礎代謝率會趨於平穩，不再有顯著變化", "在相同年齡下，男性的基礎代謝率通常高於女性"], "answer": 3}, {"ch": 2, "num": 16, "q": "血液在通過心臟時遵循特定的路徑。當血液剛從肺部獲得氧氣變為鮮紅色後，它會 首先進入心臟的哪一個腔室？", "options": ["右心室", "左心房", "右心房", "左心室"], "answer": 1}, {"ch": 6, "num": 14, "q": "衛教人員在設計宣導訊息時，若目標是鼓勵民眾執行「預防性健康行為」（如使用保 險套或進行規律運動），下列哪一種訊息框架（Message framing）通常效果最佳？", "options": ["損失框架 (Loss-framed message)", "中立無傾向框架 (Neutral framing)", "高強度恐懼訴求 (High-fear appeal)", "獲益框架 (Gain-framed message)"], "answer": 3}, {"ch": 5, "num": 7, "q": "根據健康心理學的觀點，為了提升護理機構中老年人的個人控制感（personal control）並減少無助感，下列哪種做法最適當？", "options": ["由工作人員全權代勞所有日常生活事務，避免老年人承擔任何勞務。", "避免讓老年人對生活細節進行選擇，以防選擇過多引發焦慮。", "訓練老年人接受命運不可改變，放棄對環境的任何介入嘗試。", "鼓勵並安排老年人承擔日常活動的責任，例如參與料理、清潔或社交活動的規 劃。"], "answer": 3}, {"ch": 5, "num": 16, "q": "某位剛退休的長者在被診斷出輕微關節炎後，立刻對家人宣稱：「我的生活徹底完蛋 了，這是一場無法挽回的大災難！」根據 Aaron Beck 的理論，這種思考偏誤屬於下列 何者？", "options": ["必須信念（Musterbating）", "任意推論（Arbitrary inference）", "忍無可忍（Can't-stand-itis）", "誇大/災難化（Magnification）"], "answer": 3}, {"ch": 5, "num": 19, "q": "正念減壓（Mindfulness-Based Stress Reduction）強調培養「正念覺察」，其核心 概念包含哪兩個主要成分？", "options": ["專注於當下的即時體驗，並對該體驗保持好奇、開放與接納的非批判態度。", "默誦特定音節（如 mantra）以完全阻斷任何大腦思考。", "檢討過去的失敗經驗，並對未來的風險進行嚴密分析。", "迅速辨識消極思維並運用邏輯對抗將其排解。"], "answer": 0}, {"ch": 4, "num": 1, "q": "一位剛失業的父親收到了親戚提供的臨時工作機會，以及幫忙分擔家務的協助。根據 社會支持的分類，這最符合下列哪一項？", "options": ["情緒或自尊支持", "資訊性支持", "有形或工具性支持", "陪伴性支持"], "answer": 2}, {"ch": 6, "num": 24, "q": "如美國嬌生公司（Johnson & Johnson）推行的「為生活而活」（Live for Life）這 類成功職場健康促進計畫，其核心特色不包括下列何者？", "options": ["改善工作環境（如提供健身設施與食堂健康飲食），以支持健康的行為習慣", "為參與員工提供詳細的健康篩檢（Health screen）與個人的健康評估報告", "成立專業引導的行動小組（Action groups），協助員工持久改變生活方式", "僅專注於單一健康行為干預（如僅提供戒菸課程），避免多重目標造成負擔"], "answer": 3}, {"ch": 3, "num": 1, "q": "當一個人將壓力定義為個體與環境之間的「交易」過程時，這主要強調了哪種觀點？", "options": ["壓力源與緊張反應是互不相關的兩個獨立事件。", "人是主動的代理人，能影響壓力源的衝擊。", "壓力僅僅是環境中的有害刺激。", "壓力完全取決於個體生理反應的強度。"], "answer": 1}, {"ch": 3, "num": 11, "q": "研究發現，如果孕婦在懷孕期間經歷高度壓力，最可能的後果是？", "options": ["壓力對胎兒沒有任何可測量的影響。", "孕婦在分娩時會感到更少的痛苦。", "嬰兒更有可能早產或體重不足。", "嬰兒會具有更強大的免疫系統。"], "answer": 2}, {"ch": 3, "num": 16, "q": "社會再適應量表（SRRS）的主要弱點之一是：", "options": ["它過度強調了像「鑰匙找不著」這類微小的日常煩惱。", "填寫量表需要耗費數小時，且不便操作。", "它沒有考慮事件對特定個人的主觀意義或影響。", "它包含的事件對大多數人來說都不具壓力。"], "answer": 2}, {"ch": 2, "num": 11, "q": "血壓的測量值通常由兩個數字組成（例如 120/80 mm Hg），這兩者分別代表什麼意 義？", "options": ["前者代表心跳率，後者代表血液總體積", "前者是心臟收縮時產生的最大壓力，後者是心臟放鬆時的靜止壓力", "前者是動脈中的血壓，後者是靜脈中的血壓", "前者是體循環壓力，後者是肺循環壓力"], "answer": 1}, {"ch": 3, "num": 7, "q": "長期適應壓力所累積的生理負擔被稱為什麼？", "options": ["戰或逃反應（Fight-or-flight response）", "初步評估（Primary appraisal）", "認知重估（Cognitive reappraisal）", "穩態負荷（Allostatic load）"], "answer": 3}, {"ch": 2, "num": 14, "q": "肺部雖然是呼吸的主角，但其本身並不具備主動收縮的肌肉。那麼空氣是如何進入 肺部的？", "options": ["橫膈膜收縮下移與肋骨肌群抬升，使胸腔體積擴大", "氣管壁的肌肉主動收縮，像吸管一樣吸入空氣", "心臟搏動產生的壓力直接將空氣推入支氣管", "肺部細胞主動消耗 ATP 來吞噬周圍的氧氣分子"], "answer": 0}, {"ch": 5, "num": 15, "q": "關於使用「模倣」（modeling）技術來協助兒童應對醫療或手術壓力的研究，下列敘 述何者正確？", "options": ["模倣技術的作用機制是透過給予藥物麻醉來阻斷神經連結。", "無論兒童的年齡或過去經驗為何，模倣訓練均能百分之百產生相同的減壓效果。", "透過影片呈現的符號模倣能有效降低住院兒童的焦慮，但對於8歲以下且曾有手 術經驗的兒童可能反而增加焦慮。", "模倣技術僅在實體（in vivo）現場示範時有效，透過影片或錄影帶完全無效。"], "answer": 2}, {"ch": 3, "num": 22, "q": "創傷後壓力症候群（PTSD）的一個顯著特徵是：", "options": ["頻繁地重新體驗創傷事件。", "睡眠時間過長且極易進入深度睡眠。", "對他人表現出過度熱情和親近。", "這是一種只會在戰場上的士兵身上發生的疾病。"], "answer": 0}, {"ch": 3, "num": 8, "q": "下列哪一個因素最能預測全職照顧者是否會出現更嚴重的健康問題？", "options": ["照顧者的性別，女性天生較脆弱。", "照顧者是否居住在農村地區。", "照顧者是否負責處理被照顧者的財務。", "被照顧者是否表現出明顯的痛苦。"], "answer": 3}, {"ch": 2, "num": 18, "q": "動脈硬化（Arteriosclerosis）對心血管系統最大的威脅之一是其會如何影響血壓？", "options": ["增加血液容量，使舒張壓降低至危險水平", "降低血管彈性，導致收縮壓顯著升高", "導致紅血球壽命縮短，進而引起貧血", "加速血液回流心臟，減少心臟負擔"], "answer": 1}, {"ch": 5, "num": 5, "q": "關於宗教信仰與心靈寄託（religiousness and spirituality）對壓力與健康影響的研 究，下列哪項敘述符合相關研究發現？", "options": ["宗教參與能降低壓力與促進健康，部分原因在於其推廣健康生活方式並提供社會 支持。", "出於功利或政治目的而參與宗教活動的人，能獲得最大的減壓與健康益處。", "宗教參與對降低死亡率的益處主要體現在原本已有嚴重疾病的患者身上。", "針對他人進行祈禱的統合分析顯示，祈禱能顯著改善被祈禱者的客觀健康狀況。"], "answer": 0}, {"ch": 3, "num": 5, "q": "關於壓力下的生理反應（Reactivity），下列哪項敘述是正確的？", "options": ["生理反應與遺傳無關，完全取決於環境。", "長期處於慢性壓力下的人，其生理喚起恢復到基準值的速度會變快。", "男性的生理反應通常在所有壓力情境下都低於女性。", "生理反應是透過與靜止（基準）喚起水平進行比較來衡量的。"], "answer": 3}, {"ch": 5, "num": 25, "q": "當個體面對嚴重壓力（如照護重病伴侶或面臨災難）時，常會嘗試「尋求利益或意義」 （finding benefits or meaning）。根據 Helgeson 等人 (2006) 的統合分析，尋求利益 與下列何種結果有顯著關聯？", "options": ["完全無法帶來任何心理或生理上的好處，甚至會加重悲傷。", "會大幅增加個體產生侵入性思考與反芻的風險。", "與較少的憂鬱情緒及較高的幸福感（well-being）顯著相關，但與焦慮及自我報告 的身體健康無關。", "能顯著降低焦慮感，並立即改善客觀的身體健康疾病。"], "answer": 2}, {"ch": 6, "num": 13, "q": "根據衝突理論（Conflict theory），當一個人面臨嚴重的健康威脅，且相信可能存在 更好的解決方案，但認為「時間極度緊迫」時，他最可能展現出哪種應對模式？", "options": ["防衛性迴避 (Defensive avoidance)", "警覺 (Vigilance)", "不變性 (Unconflicted adherence)", "過度警覺 (Hypervigilance)"], "answer": 3}, {"ch": 2, "num": 19, "q": "圖 2-9 顯示了主動脈弓分支的不同配置。這最能說明下列哪一個關於人體生理的觀 念？", "options": ["主動脈分支的數量會隨著年齡增長而逐漸減少", "只有在患有嚴重疾病時，血管的排列才會發生改變", "生理個體差異在內臟器官中是普遍存在的", "所有人類的內部器官構造在顯微鏡下都是完全一致的"], "answer": 2}, {"ch": 3, "num": 9, "q": "根據法蘭肯霍瑟（Frankenhaeuser）的研究，當一個人感到「努力但沒有痛苦（Effort without distress）」時，生理反應通常表現為：", "options": ["所有激素分泌均低於正常水平。", "皮質醇與兒茶酚胺均分泌增加。", "兒茶酚胺增加，但皮質醇可能被抑制。", "只有皮質醇分泌增加，兒茶酚胺減少。"], "answer": 2}, {"ch": 6, "num": 5, "q": "一位吸菸者常常在早餐喝完咖啡後，下意識地伸手拿出香菸點燃。根據健康行為的學 習機制，此情境中的「早餐後的咖啡」扮演了何種角色？", "options": ["正強化物 (Positive reinforcer)", "主觀規範 (Subjective norm)", "前因線索 (Antecedent cue)", "行動線索 (Cue to action)"], "answer": 2}, {"ch": 3, "num": 10, "q": "如果一個人在兩份同樣薪水微薄且單調乏味的工作中左右為難，這屬於哪種類型的 動機衝突？", "options": ["多重無關衝突", "趨－避衝突（Approach/avoidance conflict）", "趨－趨衝突（Approach/approach conflict）", "避－避衝突（Avoidance/avoidance conflict）"], "answer": 3}, {"ch": 2, "num": 12, "q": "下列關於胰臟（Pancreas）分泌物與血糖調節的敘述，何者正確？", "options": ["當人體處於飢餓狀態時，胰臟會大量分泌胰島素", "胰島素（Insulin）降低血糖，升糖素（Glucagon）升高血糖", "糖尿病是由於胰臟過度產生升糖素而導致的", "胰臟只在消化過程中分泌消化酶，不參與血糖調節"], "answer": 1}, {"ch": 4, "num": 5, "q": "在 Ader 與 Cohen 的實驗中，為什麼僅餵食糖精水的鼠會出現免疫系統受抑制的情 況？", "options": ["因為糖精水成了與藥物關聯的制約刺激", "因為糖精水剝奪了老鼠獲取必要營養的機會", "因為糖精本身含有破壞免疫細胞的化學成分", "因為老鼠對糖精水產生的恐懼感誘發了壓力"], "answer": 0}, {"ch": 6, "num": 4, "q": "根據社會學習理論中的模倣（Modeling）機制，下列哪一種情境最能有效促使一名青 少年採取健康的運動行為？", "options": ["看到年齡相差甚遠的異性模型因未運動而受到同儕批評", "獲得父母提供的金錢獎勵以作為完成運動任務的直接條件", "聽從權威長者詳細講解運動對心血管系統的生理好處", "觀察到同性別且具備高社會地位的同儕因運動而獲得讚賞"], "answer": 3}, {"ch": 6, "num": 20, "q": "社會階層（Socioeconomic status, SES）與健康狀況密切相關。根據來源資料，低 社會階層人群健康狀況普遍較差的關鍵原因之一是：", "options": ["過度依賴大眾媒體獲取健康衛教資訊，導致接收過多錯誤訊息", "擁有更高的生理應激適應力，因而忽視了早期症狀的診斷與治療", "擁有較差的健康習慣（如吸菸率高、缺乏運動、飲食不佳）及對風險因素認知較少", "遺傳基因缺陷的發生率顯著高於高社會階層人群"], "answer": 2}, {"ch": 6, "num": 3, "q": "一名偏頭痛患者在感到頭痛時服用止痛藥，不久後頭痛症狀消失。根據操作制約理論 ，這種頭痛消失導致未來繼續服藥的心理機制屬於下列何者？", "options": ["正強化 (Positive reinforcement)", "負強化 (Negative reinforcement)", "消退 (Extinction)", "懲罰 (Punishment)"], "answer": 1}, {"ch": 6, "num": 8, "q": "一位患有高血壓的患者雖然知道醫生建議他減重，但他認為「我現在身體好好的，過 幾年再考慮減重也不遲」，完全沒有在未來幾個月內改變飲食或運動的打算。根據跨理 論模型（Transtheoretical Model），他處於哪一個改變階段？", "options": ["預備意向階段 (Precontemplation)", "意向階段 (Contemplation)", "行動階段 (Action)", "準備階段 (Preparation)"], "answer": 0}, {"ch": 2, "num": 24, "q": "吞噬細胞（Phagocytes）在免疫防禦中被歸類為「非特異性免疫」（Nonspecific immunity），這是因為它們的運作方式為何？", "options": ["它們會巡邏全身，吞噬任何可疑的異物", "它們主要停留在淋巴結內，不進入血液循環", "它們必須依賴抗體先行標記後才能開始行動", "它們只能識別特定型號的病毒，如流行性感冒病毒"], "answer": 0}, {"ch": 3, "num": 12, "q": "一項針對 9/11 恐怖攻擊後兒童心血管反應的研究發現了什麼現象？", "options": ["恐怖攻擊對兒童的生理反應性完全沒有影響。", "攻擊後立即受測的兒童，其對新壓力源的反應性非常高。", "只有直接目擊攻擊的兒童才會顯示出反應性變化。", "一年後，這些兒童的反應性恢復到了攻擊前的極低水平。"], "answer": 1}, {"ch": 4, "num": 9, "q": "為什麼長期處於高壓力下的個體，其體內的發炎反應（Inflammation）反而可能失控 ，儘管皮質醇（Cortisol）本身具有抗發炎作用？", "options": ["壓力會完全切斷腎上腺分泌皮質醇的路徑", "免疫系統對皮質醇的敏感度降低", "發炎反應是由副交感神經直接控制的", "皮質醇在壓力過大時會轉化為促發炎物質"], "answer": 1}, {"ch": 3, "num": 20, "q": "米勒與卡法索（Miller & Cafasso）針對老人照護的元分析研究中，最核心的結論是 ：", "options": ["男性完全不負責老人的個人護理（如洗澡）。", "女性照護者比男性照護者感受到明顯更低的壓力。", "男女在提供照護、任務類型和壓力感方面相當相似。", "女性在所有照護任務中的參與度都遠高於男性。"], "answer": 2}, {"ch": 5, "num": 22, "q": "Friedman 等人 (1986) 針對上千名曾患心肌梗塞的患者進行了長達約 4.5 年的追 蹤研究，比較了「A型/心臟諮詢組」、「單純心臟諮詢組」與「對照組」。該研究的復發結果 為何？", "options": ["A型/心臟諮詢組的心臟病再發率（約 13%）顯著低於單純心臟諮詢組（21%）與對 照組（28%）。", "單純心臟諮詢組的復發率最低，顯示討論 A 型行為反而會增加患者壓力。", "三組患者的心臟病復發率完全相同，顯示行為修改對冠心病無影響。", "A型/心臟諮詢組的患者死亡率高於對照組。"], "answer": 0}, {"ch": 3, "num": 4, "q": "根據拉札勒斯（Lazarus）的理論，當一個人認為一項具有挑戰性的工作是展現能力的 機會時，其情緒反應通常會是？", "options": ["冷漠與無聊", "憤怒與敵對", "愉悅與自信的情緒", "恐懼與焦慮"], "answer": 2}, {"ch": 4, "num": 7, "q": "在 A 型人格（Type A）的各項特徵中，哪一個成分被研究證實是導致冠狀動脈心臟病 （CHD）最關鍵的「致命因素」？", "options": ["有力的說話風格", "競爭成就導向", "時間緊迫感", "憤怒與敵意"], "answer": 3}, {"ch": 5, "num": 9, "q": "在探討運動與心血管壓力反應的實驗中（如 Jennings et al., 1986），研究人員發現 每日進行 40 分鐘劇烈運動持續一個月後，對受試者產生了什麼生理影響？", "options": ["運動僅影響了受試者的心理焦慮感，對心血管客觀數據無任何改變。", "低於正常活動量的休息組在血壓下降幅度上與劇烈運動組相同。", "心率下降了 12%，且收縮壓與舒張壓分別下降了 8% 與 10%。", "心率與血壓均上升了 10%，顯示生理激起程度增加。"], "answer": 2}];
const savedKey='mental-health-ch2-ch6-110-v1';
let answers=JSON.parse(localStorage.getItem(savedKey)||'{}'),current=0;
const $=id=>document.getElementById(id),letters=['A','B','C','D'];
function render(){
let q=qs[current],n=Object.keys(answers).length;
$('position').textContent=`第 ${current+1} / ${qs.length} 題`;
$('progressText').textContent=`已作答 ${n} 題，未答 ${qs.length-n} 題`;
$('bar').style.width=(100*n/qs.length)+'%';
$('question').textContent=q.q;
$('options').replaceChildren();
q.options.forEach((opt,i)=>{let d=document.createElement('div');d.className='option'+(answers[current]===i?' selected':'');
d.innerHTML=`<span class="letter">${letters[i]}</span><span></span>`;d.lastChild.textContent=opt;
d.onclick=()=>{answers[current]=i;localStorage.setItem(savedKey,JSON.stringify(answers));render()};$('options').append(d)});
$('prev').disabled=current===0;
$('next').textContent=current===qs.length-1?'交卷並計算成績':'下一題 →';
$('submitHint').textContent=current===qs.length-1&&n<qs.length?`還有 ${qs.length-n} 題未作答，請利用題號跳題完成。`:'';
$('numbers').replaceChildren();
qs.forEach((_,i)=>{let b=document.createElement('button');b.className='num'+(answers[i]!==undefined?' answered':'')+(i===current?' current':'');b.textContent=i+1;b.onclick=()=>{current=i;render();window.scrollTo(0,0)};$('numbers').append(b)});
}
$('prev').onclick=()=>{if(current>0){current--;render()}};
$('next').onclick=()=>{if(current<qs.length-1){current++;render();window.scrollTo(0,0)}else if(Object.keys(answers).length===qs.length){if(confirm('確定交卷？交卷後會顯示正確答案。'))grade()}else alert('請先完成全部題目。')};
function grade(){
$('exam').classList.add('hidden');$('results').classList.remove('hidden');
let correct=qs.filter((q,i)=>answers[i]===q.answer).length;
$('score').textContent=(correct/qs.length*100).toFixed(1)+' 分';
$('summary').textContent=`答對 ${correct} 題，答錯 ${qs.length-correct} 題。CH6 第22題已依你的更正設定為「C. 吸菸」。`;
$('stats').replaceChildren();
[2,3,4,5,6].forEach(ch=>{let ids=qs.map((q,i)=>q.ch===ch?i:-1).filter(i=>i>=0),right=ids.filter(i=>answers[i]===qs[i].answer).length;
let d=document.createElement('div');d.className='stat';d.innerHTML=`CH${ch}<b>${right}/${ids.length}</b><span class="muted">${(100*right/ids.length).toFixed(0)}% 正確</span>`;$('stats').append(d)});
review(true);window.scrollTo(0,0)
}
function review(wrongOnly){
$('reviews').replaceChildren();let wrongCount=0;
qs.forEach((q,i)=>{let ok=answers[i]===q.answer;if(wrongOnly&&ok)return;if(!ok)wrongCount++;
let d=document.createElement('div');d.className='review';
let h=document.createElement('strong');h.textContent=`混合題第 ${i+1} 題｜原 CH${q.ch} 第 ${q.num} 題`;d.append(h);
let p=document.createElement('p');p.textContent=q.q;d.append(p);
let a=document.createElement('div');a.className=ok?'correct':'wrong';a.textContent=`你的答案：${letters[answers[i]]}．${q.options[answers[i]]}`;d.append(a);
let c=document.createElement('div');c.className='correct';c.textContent=`正確答案：${letters[q.answer]}．${q.options[q.answer]}`;d.append(c);
$('reviews').append(d)});
if(wrongOnly&&!$('reviews').children.length)$('reviews').textContent='恭喜！全部答對。'
}
$('onlyWrong').onclick=()=>review(true);
$('showAll').onclick=()=>review(false);
$('restart').onclick=()=>{if(confirm('要清除作答紀錄並重新開始嗎？')){answers={};current=0;localStorage.removeItem(savedKey);$('results').classList.add('hidden');$('exam').classList.remove('hidden');render();window.scrollTo(0,0)}};
render();
</script></body></html>
